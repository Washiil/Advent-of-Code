[workspace]
resolver = "2"
# Every year folder is a member; a newly added year is picked up automatically
members = ["20*"]

# Shared crate versions. Each year opts in with `crate.workspace = true`.
[workspace.dependencies]

# Template dependencies
chrono = "0.4.38"
dhat = "0.3.3"
pico-args = "0.5.0"
tinyjson = "2.5.1"

# Solution dependencies
bumpalo = "3.20.3"
good_lp = { version = "1.15.3", default-features = false, features = ["microlp", "coin_cbc"] }
itertools = "0.15.0"
num = "0.4.3"
pathfinding = "4.16.0"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
z3 = "0.22.0"

# Keep solutions free of terminal output; the template's own runner is exempted in src/lib.rs and src/main.rs
[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"

# Profiles are only read from the workspace root
[profile.dhat]
inherits = "release"
debug = 1
